name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: unzip -q Novatiers-corrigido.zip
      - run: cd novatiers-fabric-1.21.11 && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: novatiers-mod
          path: novatiers-fabric-1.21.11/build/libs/*.jar
